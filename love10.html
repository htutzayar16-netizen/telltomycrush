<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at center,
        #5b163c 0%,
        #27091d 38%,
        #080208 100%);
    color: white;
    font-family: Poppins, sans-serif;
}

/* =========================
   AMBIENT LIGHT
========================= */

.light {
    position: fixed;
    width: 650px;
    height: 650px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(255, 70, 150, .25),
        transparent 68%
    );

    filter: blur(35px);
    animation: breathe 6s ease-in-out infinite;
}

@keyframes breathe {
    0%,100% {
        transform: translate(-50%, -50%) scale(.85);
    }

    50% {
        transform: translate(-50%, -50%) scale(1.15);
    }
}

/* =========================
   FLOATING HEARTS
========================= */

#hearts {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.heart {
    position: absolute;
    bottom: -70px;
    opacity: 0;

    filter:
        drop-shadow(0 0 8px rgba(255,70,150,.8))
        drop-shadow(0 0 20px rgba(255,50,130,.4));

    animation: floatHeart linear infinite;
}

@keyframes floatHeart {

    0% {
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg)
            scale(.5);
        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    50% {
        transform:
            translateY(-55vh)
            translateX(40px)
            rotate(180deg)
            scale(1);
    }

    100% {
        transform:
            translateY(-120vh)
            translateX(-50px)
            rotate(360deg)
            scale(1.3);
        opacity: 0;
    }
}

/* =========================
   CENTER
========================= */

.center {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 20px;

    z-index: 10;
}

/* =========================
   CARD
========================= */

.card {
    width: min(650px, 92vw);

    padding: 55px 40px;

    border-radius: 35px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.035)
        );

    border: 1px solid rgba(255,255,255,.18);

    backdrop-filter: blur(25px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.6),
        0 0 70px rgba(255,40,130,.12);

    animation: entrance 2s cubic-bezier(.2,.8,.2,1);
}

@keyframes entrance {
    from {
        opacity: 0;
        transform: scale(.8) translateY(40px);
        filter: blur(12px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
    }
}

/* =========================
   HEART
========================= */

.mainHeart {
    font-size: 50px;
    margin-bottom: 20px;

    display: inline-block;

    animation: heartbeat 1.6s infinite;

    filter:
        drop-shadow(0 0 10px #ff4c98)
        drop-shadow(0 0 30px #ff176f);
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.18);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.12);
    }
}

/* =========================
   LABEL
========================= */

.label {
    font-size: 11px;
    letter-spacing: 5px;
    color: #ff9ac5;
    margin-bottom: 15px;
}

/* =========================
   TITLE
========================= */

h1 {
    font-family: "Great Vibes", cursive;

    font-size: clamp(60px, 11vw, 95px);

    font-weight: 400;

    line-height: 1;

    margin-bottom: 25px;

    background:
        linear-gradient(
            90deg,
            white,
            #ffb1d3,
            white
        );

    background-size: 200%;

    -webkit-backgroundclip: text;
    color: transparent;

    animation: titleGlow 5s linear infinite;
}

@keyframes titleGlow {
    to {
        background-position: 200%;
    }
}

/* =========================
   DIVIDER
========================= */

.divider {
    width: 90px;
    height: 1px;

    margin: 0 auto 25px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff72aa,
            transparent
        );
}

/* =========================
   MESSAGE
========================= */

.message {
    max-width: 520px;

    margin: auto;

    min-height: 125px;

    font-size: 16px;

    line-height: 2;

    color: rgba(255,255,255,.84);

    font-weight: 300;
}

.cursor {
    color: #ff74ae;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* =========================
   BUTTON
========================= */

button {
    margin-top: 25px;

    padding: 15px 38px;

    border-radius: 100px;

    border: 1px solid rgba(255,255,255,.2);

    background:
        linear-gradient(
            135deg,
            #ff4f9a,
            #d81764
        );

    color: white;

    font-family: Poppins;

    cursor: pointer;

    font-size: 14px;

    box-shadow:
        0 10px 35px rgba(255,30,120,.3);

    transition: .35s;
}

button:hover {
    transform:
        translateY(-4px)
        scale(1.05);

    box-shadow:
        0 15px 45px rgba(255,30,120,.55);
}

/* =========================
   FINAL MESSAGE
========================= */

.final {
    max-height: 0;
    overflow: hidden;

    opacity: 0;

    transition:
        max-height 1.2s ease,
        opacity 1s ease,
        margin .8s ease;
}

.final.show {
    max-height: 250px;
    opacity: 1;
    margin-top: 28px;
}

.final h2 {
    font-family: "Great Vibes", cursive;

    font-size: 42px;

    font-weight: 400;

    color: #ffafd2;

    text-shadow:
        0 0 15px rgba(255,70,150,.6);
}

.final p {
    margin-top: 8px;

    font-size: 13px;

    color: rgba(255,255,255,.65);
}

/* =========================
   FLASH
========================= */

#flash {
    position: fixed;
    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 50;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .card {
        padding: 45px 24px;
    }

    .message {
        font-size: 14px;
    }

    h1 {
        font-size: 60px;
    }
}
</style>
</head>

<body>

<div class="light"></div>

<div id="hearts"></div>

<div id="flash"></div>

<div class="center">

<div class="card">

    <div class="mainHeart">❤️</div>

    <div class="label">
        FOR SOMEONE SPECIAL
    </div>

    <h1>Hey, You...</h1>

    <div class="divider"></div>

    <div
        class="message"
        id="message">
    </div>

    <button onclick="reveal()">
        Read the last part 💗
    </button>

    <div
        class="final"
        id="final">

        <h2>
            You are my favorite thought. ❤️
        </h2>

        <p>
            And I hope someday, I can become yours too.
        </p>

    </div>

</div>

</div>


<script>

/* =====================================
   HEART GENERATOR
===================================== */

const heartContainer =
document.getElementById("hearts");

const hearts = [
    "❤️",
    "💗",
    "💖",
    "💕",
    "💓",
    "💞",
    "💘",
    "💝",
    "♥"
];

for(let i = 0; i < 100; i++){

    const heart =
        document.createElement("div");

    heart.className = "heart";

    heart.textContent =
        hearts[
            Math.floor(
                Math.random() * hearts.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.fontSize =
        (10 + Math.random() * 32) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 10) + "s";

    heart.style.animationDelay =
        Math.random() * 12 + "s";

    heartContainer.appendChild(heart);
}


/* =====================================
   TYPING MESSAGE
===================================== */

const text =
"Out of all the people I could have met, somehow I met you. And somewhere between the little conversations, the smiles, and the moments I remember for no reason... you became someone very special to me.";

const message =
document.getElementById("message");

let index = 0;

function type(){

    if(index < text.length){

        message.innerHTML =
            text.substring(0,index + 1) +
            '<span class="cursor">|</span>';

        index++;

        setTimeout(type,38);

    } else {

        message.innerHTML =
            text +
            '<span class="cursor">|</span>';
    }
}

setTimeout(type,1700);


/* =====================================
   REVEAL
===================================== */

function reveal(){

    document
        .getElementById("final")
        .classList.add("show");

    heartExplosion();

    screenFlash();
}


/* =====================================
   HEART EXPLOSION
===================================== */

function heartExplosion(){

    for(let i = 0; i < 60; i++){

        const heart =
            document.createElement("div");

        heart.textContent =
            hearts[
                Math.floor(
                    Math.random() * hearts.length
                )
            ];

        heart.style.position = "fixed";

        heart.style.left = "50%";
        heart.style.top = "50%";

        heart.style.fontSize =
            (12 + Math.random() * 30) + "px";

        heart.style.zIndex = "100";

        heart.style.pointerEvents = "none";

        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            120 + Math.random() * 450;

        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;

        heart.animate(

            [
                {
                    transform:
                    "translate(-50%,-50%) scale(0)",
                    opacity: 1
                },

                {
                    transform:
                    `translate(
                        calc(-50% + ${x}px),
                        calc(-50% + ${y}px)
                    )
                    scale(1.5)`,

                    opacity: 0
                }
            ],

            {
                duration:
                    1000 +
                    Math.random() * 1000,

                easing:
                    "cubic-bezier(.15,.8,.2,1)"
            }
        );

        document.body.appendChild(heart);

        setTimeout(
            () => heart.remove(),
            2200
        );
    }
}


/* =====================================
   CINEMATIC FLASH
===================================== */

function screenFlash(){

    const flash =
        document.getElementById("flash");

    flash.animate(
        [
            { opacity: 0 },
            { opacity: .12 },
            { opacity: 0 }
        ],
        {
            duration: 700
        }
    );
}

</script>

</body>
</html>
